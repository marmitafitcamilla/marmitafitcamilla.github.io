<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmita Fit da Camilla 🍃</title>
    <meta name="description" content=" ">

    <!-- Open Graph -->
    <meta property="og:title" content="Marmita Fit da Camilla 🍃">
    <meta property="og:description" content=" ">
    <meta property="og:image" content="https://marmitafitcamilla.github.io/images/og/image1.jpg">
    <meta property="og:url" content="https://marmitafitcamilla.github.io/redirects/a">

    <!-- Meta Refresh (redirect automático) -->
    <meta http-equiv="refresh" content="2">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .hero-image {
            width: 100%;
            max-width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 500px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #25D366;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.6);
        }

        .countdown {
            font-size: 1.1rem;
            margin-top: 1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://marmitafitcamilla.github.io/images/og/og-logo.png" alt="Marmita Fit da Camilla 🍃" class="hero-image">
        <h1>Marmita Fit da Camilla 🍃</h1>
        <p> </p>

        <a href="https://wa.me/5521980927987?text=Olá! Vi seu post no grupo e gostaria de fazer meu pedido de Marmita Fit!" class="whatsapp-btn" id="whatsapp-btn">
            💬 Enviar mensagem no WhatsApp
        </a>
        <div class="countdown" id="countdown">
            Redirecionando em <span id="timer">2</span> segundos...
        </div>
    </div>

    <script>
        let timeLeft = 2;
        const timerEl = document.getElementById('timer');
        const countdownEl = document.getElementById('countdown');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timerEl && timeLeft > 0) {
                timerEl.textContent = timeLeft;
            } else {
                clearInterval(countdown);
                // Opcional: esconder countdown quando zerar
                if (countdownEl) {
                    countdownEl.style.opacity = '0.5';
                }
            }
        }, 1000);  <!-- ✅ Corrigido: 1000ms (1 segundo) -->

        <!-- Redirect final -->
        setTimeout(() => {
            window.location.href = 'https://wa.me/5521980927987?text=Olá! Vi seu post no grupo e gostaria de fazer meu pedido de Marmita Fit!';
        }, 2000);
    </script>
</body>

</html>
